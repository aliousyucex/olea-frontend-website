<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico" />
  </head>
  <body style="margin: 0">
    <div class="container" style="
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    ">
      <div style="
        background: #fff8f0;
        border-radius: 30px;
        padding: 60px 40px;
        box-shadow: 0 20px 60px rgba(255, 107, 53, 0.15);
        border: 3px solid #ff6b35;
        max-width: 600px;
        width: 100%;
        position: relative;
        overflow: hidden;
      ">
        <!-- Pizza decorations -->
        <div style="
          position: absolute;
          top: -20px;
          right: -20px;
          font-size: 2rem;
          opacity: 0.3;
          transform: rotate(15deg);
        ">🍕</div>
        <div style="
          position: absolute;
          bottom: -10px;
          left: -15px;
          font-size: 1.5rem;
          opacity: 0.3;
          transform: rotate(-25deg);
        ">🍕</div>
        
        <div style="
          font-size: 5rem;
          margin-bottom: 20px;
          animation: spin 3s linear infinite;
        ">🍕</div>
        
        <h1 style="
          font-size: 3rem;
          margin: 0 0 20px 0;
          font-weight: 700;
          letter-spacing: 1px;
          color: #ff6b35;
          text-shadow: 2px 2px 0px #fff;
        ">Pizza'mız Fırında!</h1>
        
        <p style="
          font-size: 1.3rem;
          margin: 0 0 30px 0;
          color: #666;
          line-height: 1.6;
          font-weight: 500;
        ">Lezzetli içeriklerimizi hazırlıyoruz. Çok yakında sıcacık pizza'larımızla geri döneceğiz! 🔥</p>
        
        <!-- Pizza slice loading animation -->
        <div style="
          display: flex;
          justify-content: center;
          gap: 15px;
          margin-top: 40px;
        ">
          <div style="
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 15px solid #ff6b35;
            border-radius: 50%;
            animation: pizzaBounce 1.4s ease-in-out infinite both;
            animation-delay: -0.32s;
          "></div>
          <div style="
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 15px solid #ffab00;
            border-radius: 50%;
            animation: pizzaBounce 1.4s ease-in-out infinite both;
            animation-delay: -0.16s;
          "></div>
          <div style="
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 15px solid #4caf50;
            border-radius: 50%;
            animation: pizzaBounce 1.4s ease-in-out infinite both;
          "></div>
        </div>
        
       
      </div>
      
      <p style="
        margin-top: 30px;
        font-size: 1rem;
        color: #888;
        font-weight: 500;
      ">🧡 Sabırınız için teşekkürler! 🧡</p>
      
      <style>
        @keyframes pizzaBounce {
          0%, 80%, 100% {
            transform: scale(0) rotate(0deg);
          }
          40% {
            transform: scale(1) rotate(180deg);
          }
        }
        
        @keyframes spin {
          0% {
            transform: rotate(0deg);
          }
          100% {
            transform: rotate(360deg);
          }
        }
        
        @keyframes glow {
          0% {
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
            transform: scale(1);
          }
          100% {
            box-shadow: 0 0 30px rgba(255, 107, 53, 0.6);
            transform: scale(1.02);
          }
        }
        
        @media (max-width: 768px) {
          .container h1 {
            font-size: 2.2rem !important;
          }
          .container > div {
            padding: 40px 30px !important;
          }
          .container p {
            font-size: 1.1rem !important;
          }
        }
      </style>
    </div>
    <!-- <main id="app"></main>
    <script type="module" src="./index.tsx"></script> -->
  </body>
</html>
